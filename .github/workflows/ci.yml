name: CI

# PR-time trigger scope:
#   -> develop  : always -- this is the one real gate before code reaches
#                 develop, so it must run and pass here.
#   -> master   : only for hotfix/* branches. A develop -> master PR is
#                 promoting code that already passed this same CI at its
#                 own PR into develop, so re-running it is redundant. A
#                 hotfix/* branch skipped develop entirely, so PR-time CI
#                 is its only pre-merge checkpoint.
#
# Post-merge (push, via workflow_call from deploy.yml): unchanged --
# qa and develop both re-run CI after merge, gating their deploy step.
on:
  pull_request:
    branches: [develop, master]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.base_ref == 'develop' || startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Unit tests
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tier
        run: npm run test:unit

  integration:
    name: Integration tests
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tier
        run: npm run test:integration
