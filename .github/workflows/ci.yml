name: CI 

# ---------------------------------------------------------
#  Same three tiers as ci.yml, but triggered ONLY by a merge landing on
#  develop or qa. Nothing here runs pre-merge and nothing deploys.
#
#  WHY `push:` IS THE MERGE TRIGGER:
#  Once the ruleset requires a pull request, a branch cannot be written to
#  any other way -- so every push event on develop/qa IS a merge. That makes
#  `push:` the precise trigger, and it has the property the alternative
#  lacks: it runs against the real post-merge commit.
#
#  WHY NOT `pull_request: types: [closed]`:
#  That fires on close too, so it needs an `if: merged == true` guard, and it
#  still reports in the PR's context against refs/pull/N/merge -- a ref that
#  describes the pre-merge preview, not what actually landed. It answers a
#  different question than "is develop green right now".
#
#  NO `workflow_call` HERE:
#  ci.yml keeps that job. This file is a leaf -- if it were callable too,
#  the same commit could be checked twice from two directions.
# ---------------------------------------------------------

on:
  push:
    branches: [develop, qa]

# Distinct from ci.yml's `ci-` and deploy.yml's `deploy-` groups. Cancelling
# is safe because this workflow only reports -- it ships nothing that could
# be left half-applied.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Unit tests
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tier
        run: npm run test:unit

  integration:
    name: Integration tests
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tier
        run: npm run test:integration
