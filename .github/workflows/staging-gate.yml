name: Staging Gate

# ---------------------------------------------------------------
# Separate from ci.yml on purpose: CI (lint/unit/integration) keeps
# running only where it already does today -- as a required check on
# PRs into develop, and post-merge on push (gating the deploy job in
# github-actions.yml). This workflow does NOT run any tests; it only
# decides whether a PR is ALLOWED to merge into master or develop.
#
# Rulesets can only see the PR's TARGET branch, not its source, so a
# ruleset rule like "required_deployments: staging" can't tell a
# `develop -> master` promotion apart from a `hotfix/* -> master`
# emergency merge -- it would block every hotfix forever, since a
# hotfix branch (cut from master) never gets deployed to staging.
#
# It also replaces the native `required_deployments` ruleset rule on
# BOTH master and develop outright: that rule was tested and found
# unreliable on this repo -- it reported "Missing successful active
# deployment" even when the Deployments API showed a matching, current,
# successful deployment for the exact PR head SHA (reproduced twice,
# including from a clean state). This job reads the same Deployments
# API itself instead of trusting the ruleset engine's evaluation of it.
#
# One job, branch-aware on the PR's base ref:
#   -> master   : develop -> master    : head SHA must have a successful
#                                         `staging` deployment
#                 hotfix/* -> master    : waived -- hotfixes never touch
#                                         staging
#                 anything else         : rejected
#   -> develop  : qa -> develop        : head SHA must have a successful
#                                         `QA` deployment
#                 anything else         : rejected
# ---------------------------------------------------------------

on:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  deployments: read

jobs:
  staging-gate:
    name: Staging gate
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployment for the target branch, or waive for hotfix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          verify_deployment() {
            local environment="$1"
            local deploy_id
            deploy_id=$(gh api "repos/$REPO/deployments?sha=$HEAD_SHA&environment=$environment" --jq '.[0].id' 2>/dev/null || true)
            if [ -z "$deploy_id" ]; then
              echo "::error::No $environment deployment found for $HEAD_SHA"
              exit 1
            fi

            local state
            state=$(gh api "repos/$REPO/deployments/$deploy_id/statuses" --jq '.[0].state')
            if [ "$state" != "success" ]; then
              echo "::error::Latest $environment deployment state is '$state', expected 'success'"
              exit 1
            fi

            echo "::notice::$environment deployment verified for $HEAD_SHA (state: success)"
          }

          if [[ "$BASE_REF" == "master" ]]; then
            if [[ "$HEAD_REF" == hotfix/* ]]; then
              echo "::notice::hotfix branch ($HEAD_REF) — staging deployment gate waived"
              exit 0
            fi
            if [[ "$HEAD_REF" != "develop" ]]; then
              echo "::error::PRs into master must come from 'develop' or a 'hotfix/*' branch (got '$HEAD_REF')"
              exit 1
            fi
            verify_deployment staging

          elif [[ "$BASE_REF" == "develop" ]]; then
            if [[ "$HEAD_REF" != "qa" ]]; then
              echo "::error::PRs into develop must come from 'qa' (got '$HEAD_REF')"
              exit 1
            fi
            verify_deployment QA

          else
            echo "::error::Staging Gate is not configured for base branch '$BASE_REF'"
            exit 1
          fi
