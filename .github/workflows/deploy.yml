name: Deploy

# ---------------------------------------------------------
#  Runs on push to a deploy branch. Gates the deploy behind the shared CI
#  workflow, which is pulled in via `uses:` rather than duplicated here.
#
#  WHY `uses:` AND NOT A `push:` TRIGGER IN ci.yml:
#  A commit reaches this workflow only by being pushed, and reaches ci.yml's
#  own `pull_request` trigger only by being proposed. The two events never
#  fire for the same commit, so calling CI from here checks post-merge code
#  exactly once, with no second run to pay for or read past.
#
#  WHY THE CI JOB IS A `needs:` AND NOT A STEP:
#  A called workflow is a whole job graph, so it can only be attached at job
#  level. `needs: [ci]` is what makes the deploy wait on all three tiers --
#  the job is not "done" until lint, unit and integration have all passed.
#
#  CONCURRENCY: the group is deliberately NOT the one ci.yml uses. A called
#  workflow runs inside this run, so a shared name would make the run queue
#  behind itself and hang. `cancel-in-progress: false` because killing a
#  half-finished deploy is worse than letting a superseded one land first.
# ---------------------------------------------------------

on:
  push:
    branches: [develop, qa, master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# The called workflow can only narrow this, never widen it, so it has to be
# granted here even though nothing in this file reads the repo directly.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      # Placeholder -- this repo ships nothing. The point of the job is to
      # prove that it is reached only after the called CI workflow is green.
      - name: Deploy
        run: |
          echo "CI passed -- deploying ${{ github.sha }} to ${{ github.ref_name }}"
