name: Deploy

on:
  push:
    branches: [develop, qa, master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # This `if:` is CI's branch scope -- a reusable workflow cannot filter branches itself.
  ci:
    name: CI
    if: github.ref_name == 'develop' || github.ref_name == 'qa'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      deployments: read

  deploy:
    name: Deploy
    needs: [ci]
    # `skipped` is required: without it, master's skipped ci job would skip this one too.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Matches cobay-server's github-actions.yml: declaring `environment:` on a
    # job makes GitHub Actions auto-create a real Deployment record for it,
    # which is what ci.yml's staging-gate job looks up for develop -> master PRs.
    environment: ${{ github.ref_name == 'master' && 'production' || github.ref_name == 'qa' && 'QA' || 'staging' }}

    steps:
      - name: Deploy
        run: |
          echo "CI result: ${{ needs.ci.result }}"
          echo "Deploying ${{ github.sha }} to ${{ github.ref_name }}"
