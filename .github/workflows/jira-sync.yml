name: Jira Sync

# ---------------------------------------------------------
#  Keeps Jira in step with what has landed on the environment branches.
#
#  Deliberately STANDALONE: it is triggered by the push itself, not called
#  by deploy.yml, and it knows nothing about CI. Jira bookkeeping and the
#  deploy pipeline are separate concerns and are kept separately -- editing
#  one must never risk the other.
#
#    push to qa      ->  issues move to  QA
#    push to develop ->  issues move to  Staging
#    push to master  ->  issues move to  Production
#
#  TRADE-OFF OF STANDING ALONE:
#  Because it fires on the push rather than after a successful deploy, it
#  reports what has been MERGED to a branch, not what is confirmed running.
#  If a deploy later fails, Jira will already say "Staging". That is the
#  price of decoupling, and it is the right price here -- the board tracks
#  code movement, and deploy health is the pipeline's business.
#
#  WHICH ISSUES:
#  Every Jira key found in a commit subject or body across the pushed range
#  (`github.event.before..github.sha`, falling back to the last 20 commits
#  on a first push or a manual run). The join between GitHub and Jira is
#  purely that literal key string -- a commit without one is invisible here.
#
#  TRANSITIONS ARE RESOLVED BY NAME, NOT BY ID:
#  Jira transition IDs differ per project and silently change when a
#  workflow is edited, which makes hardcoded IDs a recurring source of
#  breakage. This asks Jira for the transitions actually available on the
#  issue right now and picks the one whose TARGET STATUS matches the name
#  we want. Nothing to re-sync when the board is edited.
#
#  IT NEVER FAILS THE RUN:
#  Missing credentials, an unknown issue key, or a status with no legal
#  transition are all logged as warnings; the job still succeeds.
#
#  MANUAL RUNS:
#  workflow_dispatch exposes a `dry_run` toggle -- it authenticates, prints
#  which account it is acting as, and lists what it WOULD do, without
#  touching a single issue. Use it to verify the credentials.
#
#  CONFIGURATION
#  Repository secrets (Settings -> Secrets and variables -> Actions):
#    JIRA_USER_EMAIL   Atlassian account email that owns the token
#    JIRA_API_TOKEN    https://id.atlassian.com/manage-profile/security/api-tokens
#  Repository variables:
#    JIRA_BASE_URL         e.g. https://your-org.atlassian.net   (required)
#    JIRA_PROJECT_KEYS     optional space/comma list, e.g. "TEST" -- restricts
#                          which keys are acted on. Unset = any valid key.
#    JIRA_STATUS_QA          optional, default "QA"
#    JIRA_STATUS_STAGING     optional, default "Staging"
#    JIRA_STATUS_PRODUCTION  optional, default "Production"
# ---------------------------------------------------------

on:
  push:
    branches: [qa, develop, master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify credentials and report what would change, without touching Jira'
        type: boolean
        default: true

concurrency:
  group: jira-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync issues to Jira
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Full history: the range base can be many commits back, and a
          # shallow clone would make `git log base..HEAD` fail outright.
          fetch-depth: 0

      - name: Resolve target status
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
          STATUS_QA: ${{ vars.JIRA_STATUS_QA || 'QA' }}
          STATUS_STAGING: ${{ vars.JIRA_STATUS_STAGING || 'Staging' }}
          STATUS_PRODUCTION: ${{ vars.JIRA_STATUS_PRODUCTION || 'Production' }}
        run: |
          set -euo pipefail

          case "$BRANCH" in
            qa)      ENVIRONMENT="QA";         STATUS="$STATUS_QA" ;;
            develop) ENVIRONMENT="staging";    STATUS="$STATUS_STAGING" ;;
            master)  ENVIRONMENT="production"; STATUS="$STATUS_PRODUCTION" ;;
            *)
              echo "::warning::Branch '${BRANCH}' has no Jira status mapped -- nothing to do."
              echo "status=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "Branch '${BRANCH}' (${ENVIRONMENT}) maps to Jira status '${STATUS}'."
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

      - name: Collect Jira issue keys from this push
        id: keys
        if: steps.target.outputs.status != ''
        env:
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          PROJECT_KEYS: ${{ vars.JIRA_PROJECT_KEYS }}
        run: |
          set -euo pipefail

          echo "::group::Range resolution"

          # The pushed range. Absent on a manual run or a brand-new branch,
          # in which case fall back to a fixed window so the run still says
          # something useful rather than nothing at all.
          if [ -n "${BEFORE:-}" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${SHA}"
            echo "Range: this push (${BEFORE:0:7}..${SHA:0:7})."
          elif git rev-parse -q --verify "${SHA}~20" >/dev/null; then
            RANGE="${SHA}~20..${SHA}"
            echo "Range: no push range available -- falling back to the last 20 commits."
          else
            RANGE="$SHA"
            echo "Range: full history (branch is shorter than 20 commits)."
          fi

          git log --format='  %h %s' "$RANGE"
          echo "::endgroup::"

          # A Jira key is 2+ leading chars (letter first) then -digits. Keys
          # embedded in URLs (browse/TEST-42) still match.
          KEYS=$(git log --format='%s%n%b' "$RANGE" \
                 | grep -oE '\b[A-Z][A-Z0-9]{1,9}-[0-9]+\b' \
                 | sort -u || true)

          # Optional narrowing to specific project keys.
          if [ -n "${PROJECT_KEYS:-}" ] && [ -n "$KEYS" ]; then
            FILTER=$(printf '%s' "$PROJECT_KEYS" | tr ',' ' ' | tr -s ' ')
            SELECTED=""
            for key in $KEYS; do
              prefix="${key%%-*}"
              for allowed in $FILTER; do
                if [ "$prefix" = "$allowed" ]; then
                  SELECTED="${SELECTED}${key}"$'\n'
                  break
                fi
              done
            done
            KEYS=$(printf '%s' "$SELECTED" | sed '/^$/d')
            echo "Restricted to project key(s): ${FILTER}"
          fi

          if [ -z "$KEYS" ]; then
            echo "No Jira issue keys found in this range -- nothing to sync."
          else
            echo "Found issue key(s):"
            printf '  %s\n' $KEYS
          fi

          {
            echo "keys<<KEYS_EOF"
            printf '%s\n' "$KEYS"
            echo "KEYS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Transition issues and comment
        if: steps.target.outputs.status != ''
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TARGET_STATUS: ${{ steps.target.outputs.status }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          ISSUE_KEYS: ${{ steps.keys.outputs.keys }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_USER_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "::warning::Jira is not configured (need JIRA_BASE_URL variable + JIRA_USER_EMAIL/JIRA_API_TOKEN secrets) -- skipping."
            echo "Set: JIRA_BASE_URL=${JIRA_BASE_URL:+ok}${JIRA_BASE_URL:-MISSING}, JIRA_USER_EMAIL=${JIRA_USER_EMAIL:+ok}${JIRA_USER_EMAIL:-MISSING}, JIRA_API_TOKEN=${JIRA_API_TOKEN:+ok}${JIRA_API_TOKEN:-MISSING}"
            exit 0
          fi

          BASE_URL="${JIRA_BASE_URL%/}"
          AUTH=$(printf '%s:%s' "$JIRA_USER_EMAIL" "$JIRA_API_TOKEN" | base64 -w0)
          SHORT_SHA="${SHA:0:7}"
          IST_TIME=$(TZ='Asia/Kolkata' date '+%b %d, %Y %I:%M %p IST')
          COMMIT_URL="${GITHUB_SERVER_URL}/${REPO}/commit/${SHA}"

          jira() {
            # jira <method> <path> [body-file] -> body on stdout, HTTP code in JIRA_HTTP
            local method="$1" path="$2" body_file="${3:-}"
            local args=(-sS -w '\n%{http_code}' -X "$method"
                        -H "Authorization: Basic ${AUTH}"
                        -H 'Accept: application/json'
                        -H 'Content-Type: application/json')
            [ -n "$body_file" ] && args+=(--data @"$body_file")
            local out
            out=$(curl "${args[@]}" "${BASE_URL}${path}" 2>/dev/null)
            JIRA_HTTP="${out##*$'\n'}"
            printf '%s' "${out%$'\n'*}"
          }

          # Credential check first -- this is the single most common failure,
          # and "which account am I acting as" is the answer you actually need.
          ME=$(jira GET "/rest/api/3/myself")
          if [ "$JIRA_HTTP" != "200" ]; then
            echo "::warning::Jira authentication failed (HTTP ${JIRA_HTTP}) for ${JIRA_USER_EMAIL} at ${BASE_URL} -- check JIRA_USER_EMAIL / JIRA_API_TOKEN. Nothing was changed."
            {
              echo "### Jira — authentication FAILED"
              echo ""
              echo "\`GET /rest/api/3/myself\` returned **HTTP ${JIRA_HTTP}** for \`${JIRA_USER_EMAIL}\` at \`${BASE_URL}\`."
              echo "An empty or mismatched \`JIRA_API_TOKEN\` is the usual cause."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ACCOUNT=$(printf '%s' "$ME" | jq -r '.displayName + " <" + (.emailAddress // "hidden") + ">"')
          echo "Authenticated with Jira as ${ACCOUNT}."

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY RUN -- authenticated as ${ACCOUNT}. No issues will be modified."
          fi

          if [ -z "${ISSUE_KEYS// /}" ]; then
            {
              echo "### Jira — nothing to sync"
              echo ""
              echo "Authenticated as **${ACCOUNT}**, but no Jira issue keys were found in this range."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MOVED=""; SKIPPED=""; FAILED=""

          for KEY in $ISSUE_KEYS; do
            echo "::group::${KEY}"

            ISSUE=$(jira GET "/rest/api/3/issue/${KEY}?fields=status,summary")
            if [ "$JIRA_HTTP" != "200" ]; then
              # A commit can name a key that was never a real issue -- that is
              # a typo, not a pipeline problem, so it is only ever a warning.
              echo "::warning::${KEY}: not found in Jira (HTTP ${JIRA_HTTP}) -- skipped."
              SKIPPED="${SKIPPED}${KEY} (not found)\n"
              echo "::endgroup::"; continue
            fi

            CURRENT=$(printf '%s' "$ISSUE" | jq -r '.fields.status.name // ""')
            SUMMARY=$(printf '%s' "$ISSUE" | jq -r '.fields.summary // ""')
            echo "${KEY}: \"${SUMMARY}\" is currently in '${CURRENT}'."

            if [ "$CURRENT" = "$TARGET_STATUS" ]; then
              echo "${KEY}: already in '${TARGET_STATUS}' -- no transition needed."
              SKIPPED="${SKIPPED}${KEY} (already ${TARGET_STATUS})\n"
            else
              TRANSITIONS=$(jira GET "/rest/api/3/issue/${KEY}/transitions")
              # Match on the transition's DESTINATION status, then fall back to
              # the transition's own name -- boards often label the button
              # differently from the column it lands in.
              TID=$(printf '%s' "$TRANSITIONS" | jq -r --arg s "$TARGET_STATUS" '
                ([.transitions[]? | select((.to.name // "") | ascii_downcase == ($s | ascii_downcase)) | .id]
                 + [.transitions[]? | select((.name   // "") | ascii_downcase == ($s | ascii_downcase)) | .id]
                )[0] // ""')

              if [ -z "$TID" ]; then
                AVAILABLE=$(printf '%s' "$TRANSITIONS" | jq -r '[.transitions[]?.to.name] | join(", ")')
                echo "::warning::${KEY}: no transition from '${CURRENT}' to '${TARGET_STATUS}' (available: ${AVAILABLE:-none}) -- skipped."
                SKIPPED="${SKIPPED}${KEY} (no path ${CURRENT} -> ${TARGET_STATUS})\n"
                echo "::endgroup::"; continue
              fi

              if [ "$DRY_RUN" = "true" ]; then
                echo "${KEY}: WOULD move ${CURRENT} -> ${TARGET_STATUS} (transition ${TID})."
                MOVED="${MOVED}${KEY} (would: ${CURRENT} -> ${TARGET_STATUS})\n"
                echo "::endgroup::"; continue
              fi

              jq -n --arg id "$TID" '{transition:{id:$id}}' > /tmp/transition.json
              jira POST "/rest/api/3/issue/${KEY}/transitions" /tmp/transition.json >/dev/null
              if [ "$JIRA_HTTP" != "204" ]; then
                echo "::warning::${KEY}: transition to '${TARGET_STATUS}' failed (HTTP ${JIRA_HTTP})."
                FAILED="${FAILED}${KEY} (transition HTTP ${JIRA_HTTP})\n"
                echo "::endgroup::"; continue
              fi
              echo "${KEY}: ${CURRENT} -> ${TARGET_STATUS}"
              MOVED="${MOVED}${KEY} (${CURRENT} -> ${TARGET_STATUS})\n"
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "::endgroup::"; continue
            fi

            # Comment regardless of whether a transition was needed: the issue
            # WAS part of what landed on this branch either way, and that is
            # the fact worth recording.
            jq -n \
              --arg env "$ENVIRONMENT" \
              --arg time "$IST_TIME" \
              --arg actor "$ACTOR" \
              --arg repo "$REPO" \
              --arg sha "$SHORT_SHA" \
              --arg commit_url "$COMMIT_URL" \
              --arg run_url "$RUN_URL" \
              '{body:{type:"doc",version:1,content:[{type:"paragraph",content:[
                 {type:"text",text:("Merged to " + $env),marks:[{type:"strong"}]},
                 {type:"text",text:(" on " + $time + " by " + $actor + " — " + $repo + " @ ")},
                 {type:"text",text:$sha,marks:[{type:"link",attrs:{href:$commit_url}}]},
                 {type:"text",text:" ("},
                 {type:"text",text:"workflow run",marks:[{type:"link",attrs:{href:$run_url}}]},
                 {type:"text",text:")"}
               ]}]}}' > /tmp/comment.json

            jira POST "/rest/api/3/issue/${KEY}/comment" /tmp/comment.json >/dev/null
            if [ "$JIRA_HTTP" != "201" ]; then
              echo "::warning::${KEY}: could not add comment (HTTP ${JIRA_HTTP})."
            fi

            echo "::endgroup::"
          done

          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "### Jira — DRY RUN (${ENVIRONMENT})"
            else
              echo "### Jira — synced to ${ENVIRONMENT}"
            fi
            echo ""
            echo "Acting as **${ACCOUNT}**"
            echo ""
            echo "| Result | Issues |"
            echo "| ------ | ------ |"
            printf '| Moved to `%s` | %s |\n' "$TARGET_STATUS" "$(printf '%b' "${MOVED:-—}" | paste -sd' ' -)"
            printf '| Skipped | %s |\n' "$(printf '%b' "${SKIPPED:-—}" | paste -sd' ' -)"
            printf '| Failed | %s |\n' "$(printf '%b' "${FAILED:-—}" | paste -sd' ' -)"
          } >> "$GITHUB_STEP_SUMMARY"
